<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Temporizador visual</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  min-height:100%;
  font-family:Arial,Helvetica,sans-serif;
  background:#fff;
  color:#102b5c;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  overflow:hidden;
}

.app{
  width:min(1180px,96vw);
  text-align:center;
  padding:24px 14px 34px;
}

h1{
  margin:0 auto 24px;
  padding:10px 28px;
  font-size:clamp(42px,6vw,72px);
  font-weight:900;
  color:#102b5c;
  background:#dff1ff;
  border-radius:28px;
  max-width:900px;
}

.controls{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:8px;
}

.minutes-label{
  font-size:clamp(22px,3vw,30px);
  font-weight:900;
}

input{
  width:105px;
  height:58px;
  border:3px solid #9bb1cf;
  border-radius:14px;
  font-size:29px;
  text-align:center;
  color:#102b5c;
  font-weight:800;
  background:#fff;
}

button{
  min-height:58px;
  padding:10px 24px;
  border:3px solid #9bb1cf;
  border-radius:14px;
  background:#fff;
  color:#102b5c;
  font-size:clamp(19px,2.4vw,28px);
  font-weight:900;
  cursor:pointer;
  box-shadow:0 3px 8px rgba(0,0,0,.08);
}

#start{
  background:#20b36b;
  color:#fff;
  border-color:#159355;
}

#pause{
  background:#248cff;
  color:#fff;
  border-color:#1475df;
}

#reset{
  background:#ffbf27;
  color:#102b5c;
  border-color:#eda600;
}

button:hover{
  filter:brightness(.97);
}

.timer{
  position:relative;
  width:min(70vw,680px);
  aspect-ratio:1;
  margin:10px auto 0;
}

svg{
  width:100%;
  height:100%;
  transform:rotate(-90deg);
  overflow:visible;
}

.track{
  fill:none;
  stroke:#e1e4e8;
  stroke-width:58;
}

.progress{
  fill:none;
  stroke:url(#progressGradient);
  stroke-width:58;
  stroke-linecap:round;
  transition:stroke-dashoffset .25s linear;
}

.time{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  padding-top:2px;
  font-size:clamp(72px,12vw,148px);
  font-weight:900;
  color:#102b5c;
  letter-spacing:2px;
  z-index:1;
}

/* AVISO YA QUEDA POCO */

.warning{
  display:none;
  margin:-15px auto 0;
  position:relative;
  z-index:4;
  width:min(78%,560px);
  padding:12px 22px;
  background:#fff4d6;
  border:5px solid #f28c00;
  border-radius:22px;
  color:#ed7200;
  font-size:clamp(25px,4vw,48px);
  font-weight:1000;
  line-height:1.05;
  box-shadow:
    0 8px 25px rgba(0,0,0,.12),
    0 0 18px rgba(242,140,0,.35);
  pointer-events:none;
}

/*
  Destello fuerte y llamativo.
  El aviso cambia de tamaño, brillo y sombra.
*/

.warning.show{
  display:block;
  animation:
    warningFlash .55s steps(2,end) infinite,
    warningPulse .9s ease-in-out infinite alternate;
}

@keyframes warningFlash{

  0%{
    opacity:1;
    filter:brightness(1);
  }

  50%{
    opacity:.25;
    filter:brightness(1.8);
  }

  100%{
    opacity:1;
    filter:brightness(1);
  }

}

@keyframes warningPulse{

  from{
    transform:scale(1);
    box-shadow:
      0 8px 25px rgba(0,0,0,.12),
      0 0 15px rgba(242,140,0,.30);
  }

  to{
    transform:scale(1.07);
    box-shadow:
      0 10px 30px rgba(0,0,0,.18),
      0 0 35px rgba(242,140,0,.85);
  }

}

/*
  Durante los últimos 30 segundos también
  destella el número del temporizador.
*/

.time.warning-time{
  animation:
    timeFlash .55s steps(2,end) infinite,
    timePulse .9s ease-in-out infinite alternate;
}

@keyframes timeFlash{

  0%{
    opacity:1;
  }

  50%{
    opacity:.35;
  }

  100%{
    opacity:1;
  }

}

@keyframes timePulse{

  from{
    transform:scale(1);
  }

  to{
    transform:scale(1.06);
  }

}

.hint{
  font-size:18px;
  color:#60708a;
  margin-top:16px;
}


/* PANTALLA FINAL */

.finished{
  display:none;
  position:fixed;
  inset:0;
  z-index:20;
  background:rgba(255,245,235,.98);
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
  padding:25px;
  animation:finishFlash .65s steps(2,end) infinite;
}

.finished.show{
  display:flex;
}

.finished-text{
  font-size:clamp(70px,13vw,180px);
  font-weight:1000;
  color:#e31313;
  text-transform:uppercase;
  margin:0 0 8px;
  line-height:1;
}

.finished-sub{
  font-size:clamp(27px,5vw,58px);
  font-weight:900;
  color:#17243a;
  margin-bottom:18px;
}

.finished-icon{
  font-size:clamp(100px,15vw,190px);
  line-height:1;
  margin-bottom:18px;
  filter:drop-shadow(0 5px 2px rgba(0,0,0,.08));
}

.finished button{
  background:#ed1c24;
  color:#fff;
  border-color:#c90f16;
  font-size:clamp(21px,3vw,34px);
}

@keyframes finishFlash{

  0%,49%{
    opacity:1;
  }

  50%,100%{
    opacity:.72;
  }

}


/* INDICADOR DE PANTALLA COMPLETA */

.fullscreen-message{
  display:none;
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%);
  z-index:50;
  background:#102b5c;
  color:#fff;
  padding:12px 22px;
  border-radius:14px;
  font-size:20px;
  font-weight:900;
}

.fullscreen-message.show{
  display:block;
}


@media(max-width:650px){

  .app{
    padding-top:15px;
  }

  h1{
    border-radius:20px;
    padding:9px 14px;
  }

  .timer{
    width:90vw;
  }

  .controls{
    gap:7px;
  }

  button{
    padding:8px 13px;
  }

  .warning{
    margin:-10px auto 0;
  }

}

</style>

</head>

<body>

<div class="app">

  <h1>TEMPORIZADOR VISUAL</h1>

  <div class="controls">

    <span class="minutes-label">Minutos:</span>

    <input
      id="minutes"
      type="number"
      min="1"
      max="180"
      value="5"
    >

    <button id="start">
      ▶ INICIAR
    </button>

    <button id="pause">
      Ⅱ PAUSA
    </button>

    <button id="reset">
      ↻ REINICIAR
    </button>

  </div>


  <div class="timer">

    <svg viewBox="0 0 500 500" aria-hidden="true">

      <defs>

        <linearGradient
          id="progressGradient"
          x1="0%"
          y1="0%"
          x2="100%"
          y2="100%"
        >

          <stop
            id="blueStop"
            offset="0%"
            stop-color="#087cff"
          ></stop>

          <stop
            id="redStop"
            offset="100%"
            stop-color="#ef1c2e"
          ></stop>

        </linearGradient>

      </defs>

      <circle
        class="track"
        cx="250"
        cy="250"
        r="200"
      ></circle>

      <circle
        id="progress"
        class="progress"
        cx="250"
        cy="250"
        r="200"
      ></circle>

    </svg>


    <div id="time" class="time">
      05:00
    </div>

  </div>


  <!-- EL AVISO AHORA ESTÁ DEBAJO DEL NÚMERO -->

  <div id="warning" class="warning">
    ¡YA QUEDA POCO!
  </div>


  <div class="hint">
    El círculo empieza en azul y cambia progresivamente hacia rojo al acercarse el final.
  </div>

</div>


<!-- PANTALLA FINAL -->

<div
  id="finished"
  class="finished"
  role="alert"
  aria-live="assertive"
>

  <div class="finished-text">
    ¡SE ACABÓ!
  </div>

  <div class="finished-sub">
    TIEMPO TERMINADO
  </div>

  <div
    class="finished-icon"
    aria-label="Chico indicando que se acabó"
  >
    🙅‍♂️
  </div>

  <button id="again">
    ↻ VOLVER A EMPEZAR
  </button>

</div>


<div
  id="fullscreenMessage"
  class="fullscreen-message"
>
  Toca la pantalla para poner en pantalla completa
</div>


<script>

const minutesInput =
  document.getElementById('minutes');

const timeEl =
  document.getElementById('time');

const progress =
  document.getElementById('progress');

const finished =
  document.getElementById('finished');

const warning =
  document.getElementById('warning');

const startBtn =
  document.getElementById('start');

const pauseBtn =
  document.getElementById('pause');

const resetBtn =
  document.getElementById('reset');

const againBtn =
  document.getElementById('again');

const fullscreenMessage =
  document.getElementById('fullscreenMessage');


const radius = 200;

const circumference =
  2 * Math.PI * radius;


progress.style.strokeDasharray =
  circumference;


let totalSeconds = 300;

let remaining = 300;

let timer = null;

let running = false;


/*
  NUEVA CONFIGURACIÓN

  El aviso aparece cuando quedan
  30 segundos.
*/

const WARNING_SECONDS = 30;


/*
  El sonido final dura exactamente
  20 segundos.
*/

const FINISH_SOUND_SECONDS = 20;


/*
  ------------------------------------------------
  PANTALLA COMPLETA
  ------------------------------------------------
*/

async function requestFullscreen(){

  try{

    if(!document.fullscreenElement){

      if(document.documentElement.requestFullscreen){

        await document.documentElement.requestFullscreen();

      }

      else if(document.documentElement.webkitRequestFullscreen){

        await document.documentElement.webkitRequestFullscreen();

      }

    }

    fullscreenMessage.classList.remove('show');

  }

  catch(e){

    /*
      El navegador puede bloquear la pantalla
      completa automática de una pestaña nueva.

      En ese caso mostramos un pequeño aviso.
    */

    fullscreenMessage.classList.add('show');

    setTimeout(()=>{

      fullscreenMessage.classList.remove('show');

    },4000);

  }

}


/*
  Intento automático al cargar.

  Si el navegador lo bloquea, el botón INICIAR
  volverá a intentarlo aprovechando el clic.
*/

window.addEventListener('load',()=>{

  setTimeout(()=>{

    requestFullscreen();

  },300);

});


/*
  También aprovechamos cualquier primer toque/clic
  del usuario para solicitar pantalla completa.
*/

document.addEventListener(
  'pointerdown',
  ()=>{
    requestFullscreen();
  },
  {once:true}
);


/*
  ------------------------------------------------
  FORMATO DEL TIEMPO
  ------------------------------------------------
*/

function formatTime(s){

  return (
    String(Math.floor(s / 60)).padStart(2,'0')
    +
    ':'
    +
    String(s % 60).padStart(2,'0')
  );

}


/*
  ------------------------------------------------
  ACTUALIZAR PANTALLA
  ------------------------------------------------
*/

function updateDisplay(){

  timeEl.textContent =
    formatTime(remaining);


  const ratio =
    totalSeconds
      ? remaining / totalSeconds
      : 0;


  progress.style.strokeDashoffset =
    circumference * (1 - ratio);


  /*
    AVISO A LOS 30 SEGUNDOS
  */

  const showWarning =
    remaining > 0 &&
    remaining <= WARNING_SECONDS &&
    running;


  warning.classList.toggle(
    'show',
    showWarning
  );


  /*
    El número también destella
    durante los últimos 30 segundos.
  */

  timeEl.classList.toggle(
    'warning-time',
    showWarning
  );

}


/*
  ------------------------------------------------
  ESTABLECER DURACIÓN
  ------------------------------------------------
*/

function setDuration(){

  let m =
    parseInt(
      minutesInput.value,
      10
    );


  if(!Number.isFinite(m) || m < 1){

    m = 1;

  }


  if(m > 180){

    m = 180;

  }


  minutesInput.value = m;


  totalSeconds =
    m * 60;


  remaining =
    totalSeconds;


  updateDisplay();

}


/*
  ------------------------------------------------
  AVISO SONORO FINAL
  ------------------------------------------------

  Dura 20 segundos.

  Se hacen pulsos sonoros llamativos,
  pero sin mantener un tono continuo.
*/

function beep(){

  return new Promise((resolve)=>{

    try{

      const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;


      if(!AudioContext){

        setTimeout(
          resolve,
          FINISH_SOUND_SECONDS * 1000
        );

        return;

      }


      const ctx =
        new AudioContext();


      if(ctx.state === 'suspended'){

        ctx.resume().catch(()=>{});

      }


      const now =
        ctx.currentTime;


      /*
        Pulsos durante 20 segundos.
      */

      for(
        let d = 0,
        i = 0;

        d < FINISH_SOUND_SECONDS;

        d += 0.65,
        i++
      ){

        const oscillator =
          ctx.createOscillator();


        const gain =
          ctx.createGain();


        /*
          Alternamos dos frecuencias
          para que el aviso sea reconocible.
        */

        oscillator.frequency.value =
          i % 2
            ? 880
            : 660;


        oscillator.type =
          'sine';


        gain.gain.setValueAtTime(
          0.0001,
          now + d
        );


        gain.gain.exponentialRampToValueAtTime(
          0.35,
          now + d + 0.04
        );


        gain.gain.exponentialRampToValueAtTime(
          0.0001,
          now + d + 0.38
        );


        oscillator
          .connect(gain)
          .connect(ctx.destination);


        oscillator.start(
          now + d
        );


        oscillator.stop(
          now + d + 0.42
        );

      }


      /*
        Cerramos el audio exactamente
        después de 20 segundos.
      */

      setTimeout(()=>{

        try{

          ctx.close();

        }catch(e){}


        resolve();

      }, FINISH_SOUND_SECONDS * 1000);


    }

    catch(e){

      /*
        Si el navegador no permite audio,
        esperamos igualmente 20 segundos
        antes de volver al comunicador.
      */

      setTimeout(
        resolve,
        FINISH_SOUND_SECONDS * 1000
      );

    }

  });

}


/*
  ------------------------------------------------
  VOLVER AL COMUNICADOR
  ------------------------------------------------
*/

function returnToCommunicator(){

  /*
    Primero intentamos cerrar la pestaña.

    Esto funciona si la pestaña fue abierta
    mediante window.open.
  */

  try{

    if(window.opener){

      window.opener.focus();

      window.close();

    }

  }catch(e){}


  /*
    Si el navegador no permite cerrar la pestaña,
    utilizamos la página desde la que se llegó
    al temporizador.
  */

  setTimeout(()=>{

    if(document.referrer){

      try{

        window.location.href =
          document.referrer;

        return;

      }catch(e){}

    }


    /*
      Último recurso:
      volver atrás.
    */

    try{

      window.history.back();

    }catch(e){}

  },300);

}


/*
  ------------------------------------------------
  FINAL DEL TEMPORIZADOR
  ------------------------------------------------
*/

async function finish(){

  warning.classList.remove('show');

  timeEl.classList.remove('warning-time');


  clearInterval(timer);

  timer = null;

  running = false;

  remaining = 0;


  updateDisplay();


  /*
    Mostramos inmediatamente
    la pantalla de finalización.
  */

  finished.classList.add('show');


  /*
    El aviso sonoro empieza ahora
    y dura 20 segundos.
  */

  await beep();


  /*
    SOLO después de terminar el sonido
    volvemos al comunicador.
  */

  returnToCommunicator();

}


/*
  ------------------------------------------------
  INICIAR
  ------------------------------------------------
*/

startBtn.onclick = ()=>{

  /*
    Aprovechamos el clic del usuario para
    solicitar pantalla completa.
  */

  requestFullscreen();


  if(running){

    return;

  }


  if(remaining <= 0){

    setDuration();

  }


  running = true;


  updateDisplay();


  timer = setInterval(()=>{

    remaining--;

    updateDisplay();


    if(remaining <= 0){

      finish();

    }

  },1000);

};


/*
  ------------------------------------------------
  PAUSA
  ------------------------------------------------
*/

pauseBtn.onclick = ()=>{

  if(!running){

    return;

  }


  clearInterval(timer);

  timer = null;

  running = false;


  warning.classList.remove('show');

  timeEl.classList.remove(
    'warning-time'
  );

};


/*
  ------------------------------------------------
  REINICIAR
  ------------------------------------------------
*/

resetBtn.onclick = ()=>{

  clearInterval(timer);

  timer = null;

  running = false;


  finished.classList.remove(
    'show'
  );


  warning.classList.remove(
    'show'
  );


  timeEl.classList.remove(
    'warning-time'
  );


  setDuration();

};


/*
  ------------------------------------------------
  VOLVER A EMPEZAR
  ------------------------------------------------
*/

againBtn.onclick = ()=>{

  finished.classList.remove(
    'show'
  );


  setDuration();


  requestFullscreen();


  startBtn.click();

};


/*
  ------------------------------------------------
  CAMBIO DE MINUTOS
  ------------------------------------------------
*/

minutesInput.onchange = ()=>{

  if(!running){

    setDuration();

  }

};


/*
  ------------------------------------------------
  INICIALIZACIÓN
  ------------------------------------------------
*/

setDuration();

</script>

</body>
</html>
