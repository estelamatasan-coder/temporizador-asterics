<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TEMPORIZADOR VISUAL</title>

<style>

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#fff;
  color:#102b5c;
  display:flex;
  justify-content:center;
  align-items:flex-start;
}

.app{
  width:min(1180px,96vw);
  height:100vh;
  text-align:center;
  padding:18px 14px 20px;
}

h1{
  margin:0 auto 18px;
  padding:10px 28px;
  font-size:clamp(34px,5.5vw,72px);
  font-weight:900;
  color:#102b5c;
  background:#dff1ff;
  border-radius:28px;
  max-width:1000px;
  text-transform:uppercase;
}

.controls{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:4px;
}

.minutes-label{
  font-size:clamp(20px,2.7vw,30px);
  font-weight:900;
}

input{
  width:105px;
  height:58px;
  border:3px solid #9bb1cf;
  border-radius:14px;
  font-size:29px;
  text-align:center;
  color:#102b5c;
  font-weight:800;
  background:#fff;
}

button{
  min-height:58px;
  padding:10px 22px;
  border:3px solid #9bb1cf;
  border-radius:14px;
  background:#fff;
  color:#102b5c;
  font-size:clamp(18px,2.3vw,28px);
  font-weight:900;
  cursor:pointer;
  box-shadow:0 3px 8px rgba(0,0,0,.08);
}

#start{
  background:#20b36b;
  color:#fff;
  border-color:#159355;
}

#pause{
  background:#248cff;
  color:#fff;
  border-color:#1475df;
}

#reset{
  background:#ffbf27;
  color:#102b5c;
  border-color:#eda600;
}

#fullscreen{
  display:block;
  margin:2px auto 4px;
  background:#6950e8;
  color:#fff;
  border-color:#5540c8;
}

button:hover{
  filter:brightness(.97);
}


/* =========================
   CÍRCULO DEL TEMPORIZADOR
   ========================= */

.timer{
  position:relative;
  width:min(70vw,680px);
  aspect-ratio:1;
  margin:2px auto 0;
  container-type:inline-size;
}

svg{
  width:100%;
  height:100%;
  transform:rotate(-90deg);
  overflow:visible;
}

.track{
  fill:none;
  stroke:#e1e4e8;
  stroke-width:58;
}

.progress{
  fill:none;
  stroke:url(#progressGradient);
  stroke-width:58;
  stroke-linecap:round;
  transition:stroke-dashoffset .25s linear;
}


/* =========================
   NÚMERO
   ========================= */

.time{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;

  padding:0 5%;

  font-size:clamp(64px,16cqw,148px);

  font-weight:900;
  color:#102b5c;

  letter-spacing:1px;
  line-height:1;

  z-index:2;

  white-space:nowrap;
}


/*
   PARPADEO DEL NÚMERO
   Cuando quedan 30 segundos
*/

.time.warning-number{
  animation:
    numberFlash .55s ease-in-out infinite alternate,
    numberPulse .55s ease-in-out infinite alternate;
}


@keyframes numberFlash{

  0%{
    opacity:1;
    text-shadow:
      0 0 0 rgba(255,140,0,0);
  }

  50%{
    opacity:.55;
    text-shadow:
      0 0 18px rgba(255,140,0,.8),
      0 0 35px rgba(255,140,0,.55);
  }

  100%{
    opacity:1;
    text-shadow:
      0 0 8px rgba(255,140,0,.9),
      0 0 25px rgba(255,140,0,.7);
  }

}


@keyframes numberPulse{

  from{
    transform:scale(1);
  }

  to{
    transform:scale(1.09);
  }

}


/* =========================
   AVISO YA QUEDA POCO
   ========================= */

.warning{

  display:none;

  position:absolute;

  left:50%;

  /*
     Lo colocamos claramente
     DEBAJO del número
  */

  top:65%;

  transform:translate(-50%,-50%);

  z-index:5;

  width:max-content;
  max-width:90%;

  padding:10px 22px;

  background:#fff7dc;

  border:5px solid #ff9800;

  border-radius:22px;

  color:#f07800;

  font-size:clamp(22px,6cqw,48px);

  font-weight:1000;

  line-height:1;

  box-shadow:
    0 0 12px rgba(255,152,0,.55),
    0 0 30px rgba(255,152,0,.35);

  pointer-events:none;

  white-space:nowrap;
}


.warning.show{

  display:block;

  animation:
    warningFlash .55s ease-in-out infinite alternate,
    warningMove .55s ease-in-out infinite alternate;

}


@keyframes warningFlash{

  0%{

    opacity:1;

    background:#fff7dc;

    color:#f07800;

    border-color:#ff9800;

    box-shadow:
      0 0 8px rgba(255,152,0,.5),
      0 0 15px rgba(255,152,0,.3);

  }

  50%{

    opacity:.45;

    background:#fff;

    color:#ff5c00;

    border-color:#ff6d00;

    box-shadow:
      0 0 25px rgba(255,110,0,.95),
      0 0 50px rgba(255,110,0,.7);

  }

  100%{

    opacity:1;

    background:#fff0cf;

    color:#ff5c00;

    border-color:#ff7200;

    box-shadow:
      0 0 15px rgba(255,110,0,.9),
      0 0 35px rgba(255,110,0,.6);

  }

}


@keyframes warningMove{

  from{

    transform:
      translate(-50%,-50%)
      scale(1);

  }

  to{

    transform:
      translate(-50%,-50%)
      scale(1.12);

  }

}


/* =========================
   PANTALLA FINAL
   ========================= */

.finished{

  display:none;

  position:fixed;

  inset:0;

  z-index:20;

  background:rgba(255,245,245,.98);

  align-items:center;

  justify-content:center;

  flex-direction:column;

  text-align:center;

  padding:25px;

  animation:
    finishFlash .55s steps(2,end) infinite;

}


.finished.show{
  display:flex;
}


.finished-text{

  font-size:clamp(70px,13vw,180px);

  font-weight:1000;

  color:#e31313;

  text-transform:uppercase;

  margin:0 0 8px;

  line-height:1;

}


.finished-sub{

  font-size:clamp(27px,5vw,58px);

  font-weight:900;

  color:#17243a;

  margin-bottom:18px;

}


.finished-icon{

  font-size:clamp(100px,15vw,190px);

  line-height:1;

  margin-bottom:18px;

}


.finished button{

  background:#ed1c24;

  color:#fff;

  border-color:#c90f16;

  font-size:clamp(21px,3vw,34px);

}


@keyframes finishFlash{

  0%,35%{
    opacity:1;
  }

  50%,100%{
    opacity:.70;
  }

}


/* =========================
   MÓVIL
   ========================= */

@media(max-width:650px){

  .app{
    padding-top:10px;
  }

  h1{
    border-radius:20px;
    padding:8px 12px;
    margin-bottom:10px;
  }

  .timer{
    width:88vw;
  }

  .controls{
    gap:6px;
  }

  button{
    padding:8px 12px;
  }

  .warning{
    top:66%;
  }

}


/* =========================
   PANTALLA COMPLETA
   ========================= */

:fullscreen{
  background:#fff;
}

</style>

</head>


<body>


<div class="app">


<h1>
TEMPORIZADOR VISUAL
</h1>


<div class="controls">

<span class="minutes-label">
Minutos:
</span>

<input
  id="minutes"
  type="number"
  min="1"
  max="180"
  value="5"
>

<button id="start">
▶ INICIAR
</button>

<button id="pause">
Ⅱ PAUSA
</button>

<button id="reset">
↻ REINICIAR
</button>

</div>


<button id="fullscreen">
⛶ PANTALLA COMPLETA
</button>



<div class="timer">


<svg
  viewBox="0 0 500 500"
  aria-hidden="true"
>


<defs>

<linearGradient
  id="progressGradient"
  x1="0%"
  y1="0%"
  x2="100%"
  y2="100%"
>

<stop
  id="blueStop"
  offset="0%"
  stop-color="#087cff"
></stop>

<stop
  id="redStop"
  offset="100%"
  stop-color="#ef1c2e"
></stop>

</linearGradient>

</defs>


<circle
  class="track"
  cx="250"
  cy="250"
  r="200"
></circle>


<circle
  id="progress"
  class="progress"
  cx="250"
  cy="250"
  r="200"
></circle>


</svg>


<div
  id="time"
  class="time"
>
05:00
</div>


<div
  id="warning"
  class="warning"
>
¡YA QUEDA POCO!
</div>


</div>


</div>



<div
  id="finished"
  class="finished"
  role="alert"
  aria-live="assertive"
>


<div class="finished-text">
¡SE ACABÓ!
</div>


<div class="finished-sub">
TIEMPO TERMINADO
</div>


<div class="finished-icon">
🙅‍♂️
</div>


<button id="again">
↻ VOLVER A EMPEZAR
</button>


</div>



<script>


/* =========================
   ELEMENTOS
   ========================= */

const minutesInput =
  document.getElementById('minutes');

const timeEl =
  document.getElementById('time');

const progress =
  document.getElementById('progress');

const finished =
  document.getElementById('finished');

const warning =
  document.getElementById('warning');

const startBtn =
  document.getElementById('start');

const pauseBtn =
  document.getElementById('pause');

const resetBtn =
  document.getElementById('reset');

const againBtn =
  document.getElementById('again');

const fullscreenBtn =
  document.getElementById('fullscreen');


/* =========================
   CONFIGURACIÓN
   ========================= */

const radius = 200;

const circumference =
  2 * Math.PI * radius;


/*
   AQUÍ ESTÁ EL CAMBIO IMPORTANTE:

   El aviso aparece cuando quedan
   30 segundos.
*/

const WARNING_SECONDS = 30;


/*
   El aviso final permanece
   20 segundos mientras suena.
*/

const FINISH_SOUND_SECONDS = 20;


progress.style.strokeDasharray =
  circumference;


let totalSeconds = 0;

let remaining = 0;

let timer = null;

let running = false;

let audioContext = null;

let finishReturnTimer = null;



/* =========================
   FORMATO DEL TIEMPO
   ========================= */

function formatTime(seconds){

  return (

    String(
      Math.floor(seconds / 60)
    ).padStart(2,'0')

    +

    ':'

    +

    String(
      seconds % 60
    ).padStart(2,'0')

  );

}



/* =========================
   ACTUALIZAR PANTALLA
   ========================= */

function updateDisplay(){

  timeEl.textContent =
    formatTime(remaining);


  const ratio =
    totalSeconds
      ? remaining / totalSeconds
      : 0;


  progress.style.strokeDashoffset =
    circumference * (1 - ratio);


  /*
     YA QUEDA POCO
     desde 30 segundos
  */

  const showWarning =
    remaining > 0 &&
    remaining <= WARNING_SECONDS &&
    running;


  warning.classList.toggle(
    'show',
    showWarning
  );


  /*
     El número también parpadea
  */

  timeEl.classList.toggle(
    'warning-number',
    showWarning
  );

}



/* =========================
   DURACIÓN
   ========================= */

function setDuration(){

  let m =
    parseInt(
      minutesInput.value,
      10
    );


  if(
    !Number.isFinite(m) ||
    m < 1
  ){

    m = 1;

  }


  if(m > 180){

    m = 180;

  }


  minutesInput.value = m;


  totalSeconds =
    m * 60;


  remaining =
    totalSeconds;


  updateDisplay();

}



/* =========================
   AVISO SONORO FINAL
   20 SEGUNDOS
   ========================= */

function beep(){

  try{

    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();


    const ctx =
      audioContext;


    const now =
      ctx.currentTime;


    /*
       Sonidos durante 20 segundos.
    */

    for(
      let d = 0, i = 0;
      d < FINISH_SOUND_SECONDS;
      d += .8, i++
    ){

      const oscillator =
        ctx.createOscillator();


      const gain =
        ctx.createGain();


      /*
         Dos tonos alternos
         para que sea llamativo.
      */

      oscillator.frequency.value =
        i % 2
          ? 880
          : 660;


      oscillator.type =
        'sine';


      gain.gain.setValueAtTime(
        .0001,
        now + d
      );


      gain.gain.exponentialRampToValueAtTime(
        .32,
        now + d + .04
      );


      gain.gain.exponentialRampToValueAtTime(
        .0001,
        now + d + .42
      );


      oscillator
        .connect(gain)
        .connect(ctx.destination);


      oscillator.start(
        now + d
      );


      oscillator.stop(
        now + d + .46
      );

    }


    /*
       Cerramos el audio
       después de 20 segundos.
    */

    setTimeout(
      () => {

        try{

          ctx.close();

        }catch(e){}

      },
      FINISH_SOUND_SECONDS * 1000
    );


  }catch(e){

    console.log(
      'No se pudo iniciar el sonido',
      e
    );

  }

}



/* =========================
   VOLVER AL COMUNICADOR
   ========================= */

function returnToCommunicator(){

  /*
     Primero intentamos cerrar
     esta pestaña.

     Si el navegador permite cerrar
     la pestaña abierta desde el
     comunicador, volverá directamente
     al comunicador.
  */

  try{

    window.close();

  }catch(e){}


  /*
     Si no puede cerrarse,
     intentamos volver atrás.
  */

  setTimeout(() => {

    try{

      if(
        window.history.length > 1
      ){

        window.history.back();

      }

    }catch(e){}

  },500);

}



/* =========================
   FINAL DEL TEMPORIZADOR
   ========================= */

function finish(){

  clearInterval(timer);

  timer = null;

  running = false;

  remaining = 0;


  warning.classList.remove(
    'show'
  );


  timeEl.classList.remove(
    'warning-number'
  );


  updateDisplay();


  /*
     Aparece la pantalla final.
  */

  finished.classList.add(
    'show'
  );


  /*
     Empieza el aviso sonoro.
  */

  beep();


  /*
     EXACTAMENTE 20 SEGUNDOS
     DESPUÉS:

     volver al comunicador.
  */

  clearTimeout(
    finishReturnTimer
  );


  finishReturnTimer =
    setTimeout(
      () => {

        returnToCommunicator();

      },
      FINISH_SOUND_SECONDS * 1000
    );

}



/* =========================
   INICIAR
   ========================= */

startBtn.onclick = () => {

  if(running){

    return;

  }


  /*
     Si estaba a cero,
     comenzamos una nueva cuenta.
  */

  if(remaining <= 0){

    setDuration();

  }


  running = true;


  updateDisplay();


  timer =
    setInterval(() => {

      remaining--;


      updateDisplay();


      if(remaining <= 0){

        finish();

      }

    },1000);

};



/* =========================
   PAUSA
   ========================= */

pauseBtn.onclick = () => {

  if(!running){

    return;

  }


  clearInterval(timer);

  timer = null;

  running = false;


  warning.classList.remove(
    'show'
  );


  timeEl.classList.remove(
    'warning-number'
  );

};



/* =========================
   REINICIAR
   ========================= */

resetBtn.onclick = () => {

  clearInterval(timer);

  timer = null;

  running = false;


  clearTimeout(
    finishReturnTimer
  );


  finished.classList.remove(
    'show'
  );


  warning.classList.remove(
    'show'
  );


  timeEl.classList.remove(
    'warning-number'
  );


  setDuration();

};



/* =========================
   VOLVER A EMPEZAR
   ========================= */

againBtn.onclick = () => {

  clearTimeout(
    finishReturnTimer
  );


  finished.classList.remove(
    'show'
  );


  setDuration();


  startBtn.click();

};



/* =========================
   CAMBIO DE MINUTOS
   ========================= */

minutesInput.addEventListener(
  'input',
  () => {

    if(!running){

      setDuration();

    }

  }
);


minutesInput.addEventListener(
  'change',
  () => {

    if(!running){

      setDuration();

    }

  }
);



/* =========================
   PANTALLA COMPLETA
   ========================= */

async function enterFullscreen(){

  try{

    if(
      !document.fullscreenElement
    ){

      await document
        .documentElement
        .requestFullscreen();


      fullscreenBtn.textContent =
        '⛶ SALIR DE PANTALLA COMPLETA';

    }

  }catch(e){

    /*
       Algunos navegadores bloquean
       la pantalla completa automática
       cuando la página se abre desde
       otra pestaña.
    */

    console.log(
      'El navegador ha bloqueado la pantalla completa automática.'
    );

  }

}



fullscreenBtn.onclick =
  async () => {

    try{

      if(
        !document.fullscreenElement
      ){

        await document
          .documentElement
          .requestFullscreen();


      }else{

        await document
          .exitFullscreen();

      }

    }catch(e){}

  };



/*
   Actualizar el texto del botón
   cuando cambia el estado.
*/

document.addEventListener(
  'fullscreenchange',
  () => {

    fullscreenBtn.textContent =
      document.fullscreenElement

        ? '⛶ SALIR DE PANTALLA COMPLETA'

        : '⛶ PANTALLA COMPLETA';

  }
);



/*
   Intento automático de pantalla completa.

   IMPORTANTE:
   Chrome/Edge pueden bloquearlo al
   abrir una pestaña nueva sin una
   acción directa del usuario.
*/

window.addEventListener(
  'load',
  () => {

    setDuration();


    setTimeout(
      () => {

        enterFullscreen();

      },
      300
    );

  }
);


/*
   Estado inicial
*/

setDuration();


</script>

</body>
</html>
