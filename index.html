<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEMPORIZADOR VISUAL</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:#ffffff;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}

.app{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  padding-top:5vh;
}

.title{
  background:#dff1f5;
  border-radius:18px;
  padding:18px 45px;
  text-align:center;
  font-size:clamp(28px,4vw,52px);
  font-weight:900;
  color:#263b68;
  line-height:1.15;
  margin-bottom:20px;
}

.controls{
  display:flex;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:10px;
}

.minutes-label{
  font-size:20px;
  font-weight:bold;
  color:#333;
}

#minutesInput{
  width:60px;
  height:38px;
  font-size:20px;
  text-align:center;
  border:1px solid #aaa;
  border-radius:6px;
}

button{
  border:0;
  border-radius:8px;
  padding:10px 17px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  color:white;
}

#startBtn{
  background:#32b653;
}

#pauseBtn{
  background:#3979d8;
}

#resetBtn{
  background:#e7a72e;
}

#fullscreenBtn{
  background:#6248d8;
  margin-bottom:10px;
}

button:active{
  transform:scale(.97);
}

.timerArea{
  position:relative;
  width:min(58vh,58vw,470px);
  height:min(58vh,58vw,470px);
  margin-top:5px;
}

svg{
  width:100%;
  height:100%;
  transform:rotate(-90deg);
}

.circle-bg{
  fill:none;
  stroke:#e2e5e8;
  stroke-width:14;
}

.circle-progress{
  fill:none;
  stroke:url(#timerGradient);
  stroke-width:14;
  stroke-linecap:round;
  transition:stroke-dashoffset .3s linear;
}

.timerContent{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  pointer-events:none;
}

.time{
  font-size:clamp(55px,9vw,100px);
  font-weight:900;
  color:#334d80;
  line-height:1;
  white-space:nowrap;
}

.warning{
  margin-top:12px;
  font-size:clamp(20px,3vw,34px);
  font-weight:900;
  color:#f28c28;
  text-align:center;
  line-height:1.1;
  min-height:38px;
}

.finished{
  display:none;
  position:absolute;
  inset:0;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.finished.show{
  display:flex;
}

.finishedText{
  font-size:clamp(34px,6vw,65px);
  font-weight:900;
  color:#d93636;
  line-height:1.1;
  margin-bottom:15px;
}

.finishedSubtext{
  font-size:clamp(20px,3vw,32px);
  font-weight:bold;
  color:#555;
}

/* Estado final */
.timerArea.alarm .circle-progress{
  stroke:#e53935;
  animation:pulse 0.8s infinite alternate;
}

.timerArea.alarm .time{
  color:#d93636;
}

@keyframes pulse{
  from{
    opacity:.55;
  }
  to{
    opacity:1;
  }
}

@media(max-width:600px){
  .app{
    padding-top:3vh;
  }

  .title{
    padding:12px 25px;
    margin-bottom:12px;
  }

  .controls{
    gap:6px;
  }

  button{
    font-size:14px;
    padding:8px 11px;
  }

  .timerArea{
    width:min(72vw,65vh);
    height:min(72vw,65vh);
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="title">
    TEMPORIZADOR<br>
    VISUAL
  </div>

  <div class="controls">

    <span class="minutes-label">Minutos:</span>

    <input
      id="minutesInput"
      type="number"
      min="1"
      max="180"
      value="1"
    >

    <button id="startBtn">
      ▶ INICIAR
    </button>

    <button id="pauseBtn">
      ⏸ PAUSA
    </button>

    <button id="resetBtn">
      ↻ REINICIAR
    </button>

  </div>

  <button id="fullscreenBtn">
    ⛶ PANTALLA COMPLETA
  </button>

  <div class="timerArea" id="timerArea">

    <svg viewBox="0 0 200 200">

      <defs>
        <linearGradient
          id="timerGradient"
          x1="0%"
          y1="0%"
          x2="100%"
          y2="100%"
        >
          <stop offset="0%" stop-color="#1877e8"/>
          <stop offset="100%" stop-color="#ef2d55"/>
        </linearGradient>
      </defs>

      <circle
        class="circle-bg"
        cx="100"
        cy="100"
        r="82"
      />

      <circle
        id="progressCircle"
        class="circle-progress"
        cx="100"
        cy="100"
        r="82"
      />

    </svg>

    <div class="timerContent" id="timerContent">

      <div
        id="timeDisplay"
        class="time"
      >
        01:00
      </div>

      <div
        id="warning"
        class="warning"
      ></div>

    </div>

    <div
      id="finished"
      class="finished"
    >

      <div class="finishedText">
        ¡TIEMPO TERMINADO!
      </div>

      <div class="finishedSubtext">
        Volviendo al comunicador...
      </div>

    </div>

  </div>

</div>


<script>

const minutesInput = document.getElementById("minutesInput");
const startBtn = document.getElementById("startBtn");
const pauseBtn = document.getElementById("pauseBtn");
const resetBtn = document.getElementById("resetBtn");
const fullscreenBtn = document.getElementById("fullscreenBtn");

const timeDisplay = document.getElementById("timeDisplay");
const warning = document.getElementById("warning");
const progressCircle = document.getElementById("progressCircle");
const timerArea = document.getElementById("timerArea");
const timerContent = document.getElementById("timerContent");
const finished = document.getElementById("finished");

const radius = 82;
const circumference = 2 * Math.PI * radius;

progressCircle.style.strokeDasharray = circumference;
progressCircle.style.strokeDashoffset = 0;

let totalSeconds = 60;
let remaining = 60;
let timer = null;
let running = false;
let alarmTimeout = null;
let audioContext = null;


/* --------------------------------------------------
   DURACIÓN
-------------------------------------------------- */

function setDuration(){

  let minutes = parseInt(minutesInput.value,10);

  if(isNaN(minutes) || minutes < 1){
    minutes = 1;
    minutesInput.value = 1;
  }

  if(minutes > 180){
    minutes = 180;
    minutesInput.value = 180;
  }

  totalSeconds = minutes * 60;
  remaining = totalSeconds;

  updateDisplay();
}


/* --------------------------------------------------
   FORMATO DEL TIEMPO
-------------------------------------------------- */

function formatTime(seconds){

  const mins = Math.floor(seconds / 60);
  const secs = seconds % 60;

  return String(mins).padStart(2,"0")
       + ":"
       + String(secs).padStart(2,"0");
}


/* --------------------------------------------------
   ACTUALIZAR PANTALLA
-------------------------------------------------- */

function updateDisplay(){

  timeDisplay.textContent = formatTime(remaining);

  let progress = remaining / totalSeconds;

  if(progress < 0){
    progress = 0;
  }

  const offset = circumference * (1 - progress);

  progressCircle.style.strokeDashoffset = offset;

  /*
     AVISO NARANJA:
     aparece cuando quedan 20 segundos o menos
     y queda DEBAJO del número.
  */

  if(
    remaining > 0 &&
    remaining <= 20 &&
    running
  ){

    warning.textContent = "¡YA QUEDA POCO!";

  }else{

    warning.textContent = "";

  }
}


/* --------------------------------------------------
   SONIDO
   DURA EXACTAMENTE 20 SEGUNDOS
-------------------------------------------------- */

function beep(){

  try{

    if(!audioContext){

      audioContext =
        new (window.AudioContext ||
             window.webkitAudioContext)();

    }

    if(audioContext.state === "suspended"){
      audioContext.resume();
    }

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    oscillator.type = "sine";

    oscillator.frequency.setValueAtTime(
      880,
      audioContext.currentTime
    );

    gain.gain.setValueAtTime(
      0.0001,
      audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      0.35,
      audioContext.currentTime + 0.02
    );

    gain.gain.exponentialRampToValueAtTime(
      0.0001,
      audioContext.currentTime + 0.45
    );

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start();

    oscillator.stop(
      audioContext.currentTime + 0.5
    );

  }catch(e){

    console.log("No se pudo reproducir el sonido:",e);

  }
}


/* --------------------------------------------------
   AVISO SONORO DE 20 SEGUNDOS
-------------------------------------------------- */

function startAlarm(){

  /*
     Durante estos 20 segundos:
     - permanece visible el temporizador
     - aparece TIEMPO TERMINADO
     - suena el aviso
     - NO vuelve todavía al comunicador
  */

  timerArea.classList.add("alarm");

  timerContent.style.display = "none";

  finished.classList.add("show");

  /*
     Primer sonido inmediatamente
  */

  beep();

  /*
     Repetimos el sonido cada segundo
  */

  let alarmInterval = setInterval(
    beep,
    1000
  );

  /*
     EXACTAMENTE 20 segundos después
     detenemos el sonido y volvemos
     al comunicador.
  */

  alarmTimeout = setTimeout(function(){

    clearInterval(alarmInterval);

    stopAllAudio();

    returnToCommunicator();

  },20000);

}


/* --------------------------------------------------
   DETENER AUDIO
-------------------------------------------------- */

function stopAllAudio(){

  try{

    if(audioContext){

      audioContext.close();
      audioContext = null;

    }

  }catch(e){}

}


/* --------------------------------------------------
   VOLVER AL COMUNICADOR
-------------------------------------------------- */

function returnToCommunicator(){

  /*
     IMPORTANTE:
     NO usamos window.location.reload();

     reload() volvería a cargar EL TEMPORIZADOR.

     history.back() devuelve a la pantalla anterior,
     que es donde se encontraba el comunicador.
  */

  if(window.history.length > 1){

    window.history.back();

  }else{

    /*
       Si el navegador no tiene historial,
       intentamos cerrar esta ventana/pestaña.
    */

    window.close();

  }

}


/* --------------------------------------------------
   INICIAR
-------------------------------------------------- */

startBtn.onclick = function(){

  if(running){
    return;
  }

  /*
     Si está a cero, volvemos a cargar la duración.
  */

  if(remaining <= 0){
    setDuration();
  }

  /*
     Activamos el audio desde la acción del usuario.
     Esto evita problemas de bloqueo del navegador.
  */

  try{

    if(!audioContext){

      audioContext =
        new (window.AudioContext ||
             window.webkitAudioContext)();

    }

    if(audioContext.state === "suspended"){
      audioContext.resume();
    }

  }catch(e){}

  running = true;

  updateDisplay();

  timer = setInterval(function(){

    remaining--;

    updateDisplay();

    if(remaining <= 0){

      clearInterval(timer);

      timer = null;

      running = false;

      remaining = 0;

      updateDisplay();

      startAlarm();

    }

  },1000);

};


/* --------------------------------------------------
   PAUSA
-------------------------------------------------- */

pauseBtn.onclick = function(){

  if(!running){
    return;
  }

  clearInterval(timer);

  timer = null;

  running = false;

  warning.textContent = "";

  updateDisplay();

};


/* --------------------------------------------------
   REINICIAR
-------------------------------------------------- */

resetBtn.onclick = function(){

  clearInterval(timer);

  timer = null;

  running = false;

  if(alarmTimeout){
    clearTimeout(alarmTimeout);
    alarmTimeout = null;
  }

  stopAllAudio();

  timerArea.classList.remove("alarm");

  timerContent.style.display = "flex";

  finished.classList.remove("show");

  setDuration();

};


/* --------------------------------------------------
   CAMBIO DE MINUTOS
-------------------------------------------------- */

minutesInput.onchange = function(){

  if(running){
    return;
  }

  setDuration();

};


/* --------------------------------------------------
   PANTALLA COMPLETA
-------------------------------------------------- */

fullscreenBtn.onclick = async function(){

  try{

    if(!document.fullscreenElement){

      await document.documentElement.requestFullscreen();

      fullscreenBtn.textContent =
        "⛶ SALIR DE PANTALLA COMPLETA";

    }else{

      await document.exitFullscreen();

      fullscreenBtn.textContent =
        "⛶ PANTALLA COMPLETA";

    }

  }catch(e){

    console.log(
      "Pantalla completa no disponible",
      e
    );

  }

};


/* --------------------------------------------------
   CAMBIO DE PANTALLA COMPLETA
-------------------------------------------------- */

document.addEventListener(
  "fullscreenchange",
  function(){

    if(document.fullscreenElement){

      fullscreenBtn.textContent =
        "⛶ SALIR DE PANTALLA COMPLETA";

    }else{

      fullscreenBtn.textContent =
        "⛶ PANTALLA COMPLETA";

    }

  }
);


/* --------------------------------------------------
   INICIALIZACIÓN
-------------------------------------------------- */

setDuration();

</script>

</body>
</html>
