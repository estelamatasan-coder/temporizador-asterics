<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEMPORIZADOR VISUAL</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{min-height:100dvh;font-family:Arial,Helvetica,sans-serif;background:#fff;color:#102b5c;display:flex;justify-content:center;align-items:center}
.app{width:100%;height:100dvh;text-align:center;padding:clamp(8px,2vh,24px) clamp(10px,2vw,20px);display:flex;flex-direction:column;align-items:center;overflow:hidden}
h1{flex:0 0 auto;margin:0 auto clamp(8px,2vh,20px);padding:clamp(7px,1.2vh,12px) clamp(18px,3vw,28px);font-size:clamp(30px,5vw,64px);font-weight:900;color:#102b5c;background:#dff1ff;border-radius:24px;max-width:900px;text-transform:uppercase}
.controls{flex:0 0 auto;display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:clamp(4px,1vh,10px)}
.minutes-label{font-size:clamp(18px,2.5vw,30px);font-weight:900}
input{width:100px;height:54px;border:3px solid #9bb1cf;border-radius:14px;font-size:27px;text-align:center;color:#102b5c;font-weight:800;background:#fff}
button{min-height:54px;padding:9px 20px;border:3px solid #9bb1cf;border-radius:14px;background:#fff;color:#102b5c;font-size:clamp(17px,2.1vw,27px);font-weight:900;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.08)}
#start{background:#20b36b;color:#fff;border-color:#159355}
#pause{background:#248cff;color:#fff;border-color:#1475df}
#reset{background:#ffbf27;color:#102b5c;border-color:#eda600}
#fullscreenBtn{background:#6b5cff;color:#fff;border-color:#5144d9}
button:hover{filter:brightness(.97)}
.timer{position:relative;flex:1 1 auto;min-height:0;min-width:0;width:min(76vw, calc(100dvh - 205px), 680px);aspect-ratio:1;margin:0 auto;display:flex;align-items:center;justify-content:center}
svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.track{fill:none;stroke:#e1e4e8;stroke-width:58}
.progress{fill:none;stroke:url(#progressGradient);stroke-width:58;stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.time{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;padding-top:2px;font-size:clamp(64px,12vw,148px);font-weight:900;color:#102b5c;letter-spacing:2px;z-index:1}
.warning{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;width:min(78%,560px);padding:12px 22px;background:#fff8cf;border:5px solid #ffb800;border-radius:22px;color:#d51f1f;font-size:clamp(25px,4vw,48px);font-weight:1000;line-height:1.05;box-shadow:0 8px 25px rgba(0,0,0,.12);pointer-events:none}
.warning.show{display:block;animation:pulse .9s ease-in-out infinite alternate}
@keyframes pulse{from{transform:translate(-50%,-50%) scale(1)}to{transform:translate(-50%,-50%) scale(1.035)}}
.hint{display:none}
.finished{display:none;position:fixed;inset:0;z-index:20;background:rgba(255,245,245,.98);align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:25px;animation:finishFlash .9s steps(2,end) infinite}
.finished.show{display:flex}
.finished-text{font-size:clamp(60px,13vw,180px);font-weight:1000;color:#e31313;text-transform:uppercase;margin:0 0 8px;line-height:1}
.finished-sub{font-size:clamp(27px,5vw,58px);font-weight:900;color:#17243a;margin-bottom:18px}
.finished-icon{font-size:clamp(100px,15vw,190px);line-height:1;margin-bottom:18px;filter:drop-shadow(0 5px 2px rgba(0,0,0,.08))}
.finished button{background:#ed1c24;color:#fff;border-color:#c90f16;font-size:clamp(21px,3vw,34px)}
@keyframes finishFlash{0%,49%{opacity:1}50%,100%{opacity:.72}}
@media(max-width:700px){
  .app{padding:8px}
  h1{border-radius:18px;padding:7px 12px;margin-bottom:8px}
  .controls{gap:5px;margin-bottom:4px}
  button{padding:7px 10px;min-height:48px}
  input{width:82px;height:48px}
  .timer{width:min(94vw,calc(100dvh - 175px))}
}
@media(max-height:600px){
  h1{font-size:clamp(24px,5vh,42px);margin-bottom:4px}
  .controls{transform:scale(.86);transform-origin:top center;margin-bottom:-2px}
  .timer{width:min(72vw,calc(100dvh - 125px))}
}

  .warning {
    position: absolute;
    left: 50%;
    top: calc(50% + min(20vw, 125px));
    transform: translateX(-50%);
    z-index: 3;
    display: none;
    white-space: nowrap;
    background: white;
    border: 5px solid #ff7043;
    border-radius: 18px;
    padding: 10px 24px;
    font-size: clamp(24px, 4vw, 48px);
    font-weight: 900;
    color: #ff7043;
    box-shadow: 0 5px 18px rgba(0,0,0,.12);
  }

  .warning.show {
    display: block;
  }
</style>
</head>
<body>
<div class="app">
<h1>TEMPORIZADOR VISUAL</h1>
<div class="controls">
<span class="minutes-label">Minutos:</span>
<input id="minutes" type="number" min="1" max="180" value="5">
<button id="start">▶ INICIAR</button>
<button id="pause">Ⅱ PAUSA</button>
<button id="reset">↻ REINICIAR</button>
<button id="fullscreenBtn">⛶ PANTALLA COMPLETA</button>
</div>

<div class="timer">
<svg viewBox="0 0 500 500" aria-hidden="true">
<defs>
<linearGradient id="progressGradient" x1="0%" y1="0%" x2="100%" y2="100%">
<stop id="blueStop" offset="0%" stop-color="#087cff"></stop>
<stop id="redStop" offset="100%" stop-color="#ef1c2e"></stop>
</linearGradient>
</defs>
<circle class="track" cx="250" cy="250" r="200"></circle>
<circle id="progress" class="progress" cx="250" cy="250" r="200"></circle>
</svg>
<div id="time" class="time">05:00</div>
<div id="warning" class="warning">¡YA QUEDA POCO!</div>
</div>
</div>

<div id="finished" class="finished" role="alert" aria-live="assertive">
<div class="finished-text">¡SE ACABÓ!</div>
<div class="finished-sub">TIEMPO TERMINADO</div>
<div class="finished-icon" aria-label="Chico indicando que se acabó">🙅‍♂️</div>
<button id="again">↻ VOLVER A EMPEZAR</button>
</div>

<script>
const minutesInput=document.getElementById('minutes');
const timeEl=document.getElementById('time');
const progress=document.getElementById('progress');
const finished=document.getElementById('finished');
const warning=document.getElementById('warning');
const startBtn=document.getElementById('start');
const pauseBtn=document.getElementById('pause');
const resetBtn=document.getElementById('reset');
const againBtn=document.getElementById('again');
const fullscreenBtn=document.getElementById('fullscreenBtn');
const radius=200;
const circumference=2*Math.PI*radius;
progress.style.strokeDasharray=circumference;
let totalSeconds=300;
let remaining=300;
let timer=null;
let running=false;

function formatTime(s){
return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
}
function updateDisplay(){
timeEl.textContent=formatTime(remaining);
const ratio=totalSeconds?remaining/totalSeconds:0;
progress.style.strokeDashoffset=circumference*(1-ratio);
warning.classList.toggle('show',remaining>0&&remaining<=20&&running);
}
function setDuration(){
let m=parseInt(minutesInput.value,10);
if(!Number.isFinite(m)||m<1)m=1;
if(m>180)m=180;
minutesInput.value=m;
totalSeconds=m*60;
remaining=totalSeconds;
updateDisplay();
}
function beep(){
try{
const ctx=new(window.AudioContext||window.webkitAudioContext)();
const now=ctx.currentTime;
for(let d=0,i=0;d<20;d+=.8,i++){
const o=ctx.createOscillator();
const g=ctx.createGain();
o.frequency.value=i%2?880:660;
o.type='sine';
g.gain.setValueAtTime(.0001,now+d);
g.gain.exponentialRampToValueAtTime(.32,now+d+.04);
g.gain.exponentialRampToValueAtTime(.0001,now+d+.42);
o.connect(g).connect(ctx.destination);
o.start(now+d);
o.stop(now+d+.46);
}
setTimeout(()=>ctx.close(),21000);
}catch(e){}
}
async function enterFullscreen(){
try{
if(!document.fullscreenElement && document.documentElement.requestFullscreen){
await document.documentElement.requestFullscreen();
}
}catch(e){}
}
function updateFullscreenButton(){
fullscreenBtn.textContent=document.fullscreenElement?'⛶ SALIR DE PANTALLA COMPLETA':'⛶ PANTALLA COMPLETA';
}
fullscreenBtn.onclick=async()=>{
if(document.fullscreenElement){
try{await document.exitFullscreen()}catch(e){}
}else{
await enterFullscreen();
}
updateFullscreenButton();
};
document.addEventListener('fullscreenchange',updateFullscreenButton);

function finish(){
warning.classList.remove('show');
clearInterval(timer);
timer=null;
running=false;
remaining=0;
updateDisplay();
finished.classList.add('show');
beep();
}
startBtn.onclick=()=>{
enterFullscreen();
if(running)return;
if(remaining<=0)setDuration();
running=true;
updateDisplay();
timer=setInterval(()=>{
remaining--;
updateDisplay();
if(remaining<=0)finish();
},1000);
};
pauseBtn.onclick=()=>{
if(!running)return;
clearInterval(timer);
timer=null;
running=false;
warning.classList.remove('show');
};
resetBtn.onclick=()=>{
clearInterval(timer);
timer=null;
running=false;
finished.classList.remove('show');
warning.classList.remove('show');
setDuration();
};
againBtn.onclick=()=>{
finished.classList.remove('show');
enterFullscreen();
setDuration();
startBtn.click();
};
minutesInput.onchange=()=>{if(!running)setDuration()};
setDuration();
</script>
</body>
</html>
