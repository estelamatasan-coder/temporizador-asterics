<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEMPORIZADOR VISUAL</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#fff;
  color:#102b5c;
  display:flex;
  justify-content:center;
  align-items:flex-start;
}

.app{
  width:min(1180px,96vw);
  height:100vh;
  text-align:center;
  padding:18px 14px 20px;
}

h1{
  margin:0 auto 18px;
  padding:10px 28px;
  font-size:clamp(34px,5.5vw,72px);
  font-weight:900;
  color:#102b5c;
  background:#dff1ff;
  border-radius:28px;
  max-width:1000px;
  text-transform:uppercase;
}

.controls{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:4px;
}

.minutes-label{
  font-size:clamp(20px,2.7vw,30px);
  font-weight:900;
}

input{
  width:105px;
  height:58px;
  border:3px solid #9bb1cf;
  border-radius:14px;
  font-size:29px;
  text-align:center;
  color:#102b5c;
  font-weight:800;
  background:#fff;
}

button{
  min-height:58px;
  padding:10px 22px;
  border:3px solid #9bb1cf;
  border-radius:14px;
  background:#fff;
  color:#102b5c;
  font-size:clamp(18px,2.3vw,28px);
  font-weight:900;
  cursor:pointer;
  box-shadow:0 3px 8px rgba(0,0,0,.08);
}

#start{
  background:#20b36b;
  color:#fff;
  border-color:#159355;
}

#pause{
  background:#248cff;
  color:#fff;
  border-color:#1475df;
}

#reset{
  background:#ffbf27;
  color:#102b5c;
  border-color:#eda600;
}

#fullscreen{
  display:block;
  margin:2px auto 4px;
  background:#6950e8;
  color:#fff;
  border-color:#5540c8;
}

button:hover{
  filter:brightness(.97);
}

.timer{
  position:relative;
  width:min(70vw,680px);
  aspect-ratio:1;
  margin:2px auto 0;
  container-type:inline-size;
}

svg{
  width:100%;
  height:100%;
  transform:rotate(-90deg);
  overflow:visible;
}

.track{
  fill:none;
  stroke:#e1e4e8;
  stroke-width:58;
}

.progress{
  fill:none;
  stroke:url(#progressGradient);
  stroke-width:58;
  stroke-linecap:round;
  transition:stroke-dashoffset .25s linear;
}

.time{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:0 5%;
  font-size:clamp(64px,20cqw,148px);
  font-weight:900;
  color:#102b5c;
  letter-spacing:1px;
  line-height:1;
  z-index:1;
  white-space:nowrap;
}

/* AVISO NARANJA Y DEBAJO DEL NÚMERO */
.warning{
  display:none;
  position:absolute;
  left:0;
  right:0;
  top:64%;
  transform:translateY(-50%);
  z-index:4;
  color:#f28c00;
  font-size:clamp(22px,6cqw,48px);
  font-weight:1000;
  line-height:1;
  pointer-events:none;
  white-space:nowrap;
  text-shadow:0 1px 0 #fff;
}

.warning.show{
  display:block;
  animation:pulse .9s ease-in-out infinite alternate;
}

@keyframes pulse{
  from{
    transform:translateY(-50%) scale(1);
  }
  to{
    transform:translateY(-50%) scale(1.035);
  }
}

/* PANTALLA FINAL */
.finished{
  display:none;
  position:fixed;
  inset:0;
  z-index:20;
  background:rgba(255,245,245,.98);
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
  padding:25px;
  animation:finishFlash .9s steps(2,end) infinite;
}

.finished.show{
  display:flex;
}

.finished-text{
  font-size:clamp(70px,13vw,180px);
  font-weight:1000;
  color:#e31313;
  text-transform:uppercase;
  margin:0 0 8px;
  line-height:1;
}

.finished-sub{
  font-size:clamp(27px,5vw,58px);
  font-weight:900;
  color:#17243a;
  margin-bottom:18px;
}

.finished-icon{
  font-size:clamp(100px,15vw,190px);
  line-height:1;
  margin-bottom:18px;
}

.finished button{
  background:#ed1c24;
  color:#fff;
  border-color:#c90f16;
  font-size:clamp(21px,3vw,34px);
}

@keyframes finishFlash{
  0%,49%{
    opacity:1;
  }

  50%,100%{
    opacity:.72;
  }
}

@media(max-width:650px){

  .app{
    padding-top:10px;
  }

  h1{
    border-radius:20px;
    padding:8px 12px;
    margin-bottom:10px;
  }

  .timer{
    width:88vw;
  }

  .controls{
    gap:6px;
  }

  button{
    padding:8px 12px;
  }

  .warning{
    top:66%;
  }
}
</style>
</head>

<body>

<div class="app">

  <h1>TEMPORIZADOR VISUAL</h1>

  <div class="controls">

    <span class="minutes-label">Minutos:</span>

    <input
      id="minutes"
      type="number"
      min="1"
      max="180"
      value="5"
    >

    <button id="start">▶ INICIAR</button>

    <button id="pause">Ⅱ PAUSA</button>

    <button id="reset">↻ REINICIAR</button>

  </div>

  <button id="fullscreen">
    ⛶ PANTALLA COMPLETA
  </button>

  <div class="timer">

    <svg viewBox="0 0 500 500" aria-hidden="true">

      <defs>

        <linearGradient
          id="progressGradient"
          x1="0%"
          y1="0%"
          x2="100%"
          y2="100%"
        >
          <stop
            offset="0%"
            stop-color="#087cff"
          ></stop>

          <stop
            offset="100%"
            stop-color="#ef1c2e"
          ></stop>

        </linearGradient>

      </defs>

      <circle
        class="track"
        cx="250"
        cy="250"
        r="200"
      ></circle>

      <circle
        id="progress"
        class="progress"
        cx="250"
        cy="250"
        r="200"
      ></circle>

    </svg>

    <div id="time" class="time">
      05:00
    </div>

    <div id="warning" class="warning">
      ¡YA QUEDA POCO!
    </div>

  </div>

</div>


<!-- PANTALLA FINAL -->

<div
  id="finished"
  class="finished"
  role="alert"
  aria-live="assertive"
>

  <div class="finished-text">
    ¡SE ACABÓ!
  </div>

  <div class="finished-sub">
    TIEMPO TERMINADO
  </div>

  <div class="finished-icon">
    🙅‍♂️
  </div>

  <button id="again">
    ↻ VOLVER A EMPEZAR
  </button>

</div>


<script>

const minutesInput =
  document.getElementById('minutes');

const timeEl =
  document.getElementById('time');

const progress =
  document.getElementById('progress');

const finished =
  document.getElementById('finished');

const warning =
  document.getElementById('warning');

const startBtn =
  document.getElementById('start');

const pauseBtn =
  document.getElementById('pause');

const resetBtn =
  document.getElementById('reset');

const againBtn =
  document.getElementById('again');

const fullscreenBtn =
  document.getElementById('fullscreen');


const radius = 200;

const circumference =
  2 * Math.PI * radius;

progress.style.strokeDasharray =
  circumference;


let totalSeconds = 300;

let remaining = 300;

let timer = null;

let running = false;

let returnTimer = null;

let audioCtx = null;


/* FORMATO DEL TIEMPO */

function formatTime(s){

  return (
    String(Math.floor(s / 60)).padStart(2,'0')
    +
    ':'
    +
    String(s % 60).padStart(2,'0')
  );

}


/* ACTUALIZAR PANTALLA */

function updateDisplay(){

  timeEl.textContent =
    formatTime(remaining);

  const ratio =
    totalSeconds
      ? remaining / totalSeconds
      : 0;

  progress.style.strokeDashoffset =
    circumference * (1 - ratio);


  warning.classList.toggle(
    'show',
    remaining > 0 &&
    remaining <= 20 &&
    running
  );

}


/* ESTABLECER DURACIÓN */

function setDuration(){

  let m =
    parseInt(minutesInput.value,10);

  if(
    !Number.isFinite(m) ||
    m < 1
  ){
    m = 1;
  }

  if(m > 180){
    m = 180;
  }

  minutesInput.value = m;

  totalSeconds =
    m * 60;

  remaining =
    totalSeconds;

  updateDisplay();

}


/* PREPARAR AUDIO */

async function prepareAudio(){

  try{

    if(!audioCtx){

      audioCtx =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }

    if(
      audioCtx.state === 'suspended'
    ){

      await audioCtx.resume();

    }

  }catch(e){

    audioCtx = null;

  }

}


/* AVISO SONORO DURANTE 20 SEGUNDOS */

function beep20Seconds(){

  if(!audioCtx){
    return;
  }

  try{

    const now =
      audioCtx.currentTime;


    for(
      let d = 0, i = 0;
      d < 20;
      d += 0.8, i++
    ){

      const oscillator =
        audioCtx.createOscillator();

      const gain =
        audioCtx.createGain();


      oscillator.frequency.value =
        i % 2
          ? 880
          : 660;

      oscillator.type =
        'sine';


      gain.gain.setValueAtTime(
        0.0001,
        now + d
      );


      gain.gain.exponentialRampToValueAtTime(
        0.32,
        now + d + 0.04
      );


      gain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + d + 0.42
      );


      oscillator
        .connect(gain)
        .connect(audioCtx.destination);


      oscillator.start(
        now + d
      );


      oscillator.stop(
        now + d + 0.46
      );

    }

  }catch(e){}

}


/*
  VOLVER AL COMUNICADOR

  Primero intenta volver a la página desde
  la que se abrió el temporizador.

  Si no existe esa referencia,
  utiliza el historial del navegador.
*/

function returnToCommunicator(){

  const ref =
    document.referrer;


  if(
    ref &&
    ref !== window.location.href
  ){

    window.location.replace(ref);

    return;

  }


  if(
    window.history.length > 1
  ){

    window.history.back();

    return;

  }

}


/* CANCELAR PANTALLA FINAL */

function cancelFinish(){

  if(returnTimer){

    clearTimeout(returnTimer);

    returnTimer = null;

  }


  if(audioCtx){

    try{

      audioCtx.close();

    }catch(e){}

    audioCtx = null;

  }

}


/* TERMINAR TEMPORIZADOR */

function finish(){

  clearInterval(timer);

  timer = null;

  running = false;

  remaining = 0;

  updateDisplay();


  /*
    La pantalla final aparece
    inmediatamente.
  */

  finished.classList.add('show');


  /*
    El sonido comienza inmediatamente
    y dura 20 segundos.
  */

  beep20Seconds();


  /*
    MUY IMPORTANTE:
    no vuelve al comunicador hasta
    que hayan pasado 20 segundos.
  */

  returnTimer =
    setTimeout(

      () => {

        returnTimer = null;

        returnToCommunicator();

      },

      20000

    );

}


/* BOTÓN INICIAR */

startBtn.onclick = async () => {

  if(running){
    return;
  }


  if(remaining <= 0){

    setDuration();

  }


  await prepareAudio();


  running = true;

  updateDisplay();


  timer =
    setInterval(

      () => {

        remaining--;

        updateDisplay();


        if(
          remaining <= 0
        ){

          finish();

        }

      },

      1000

    );

};


/* BOTÓN PAUSA */

pauseBtn.onclick = () => {

  if(!running){
    return;
  }


  clearInterval(timer);

  timer = null;

  running = false;

  warning.classList.remove('show');

};


/* BOTÓN REINICIAR */

resetBtn.onclick = () => {

  clearInterval(timer);

  timer = null;

  running = false;

  cancelFinish();

  finished.classList.remove('show');

  warning.classList.remove('show');

  setDuration();

};


/* VOLVER A EMPEZAR */

againBtn.onclick = () => {

  cancelFinish();

  finished.classList.remove('show');

  setDuration();

  startBtn.click();

};


/* CAMBIO DE MINUTOS */

minutesInput.onchange = () => {

  if(!running){

    setDuration();

  }

};


/* PANTALLA COMPLETA */

fullscreenBtn.onclick =
  async () => {

    try{

      if(
        !document.fullscreenElement
      ){

        await document
          .documentElement
          .requestFullscreen();

      }else{

        await document
          .exitFullscreen();

      }

    }catch(e){}

  };


/* CAMBIO DEL TEXTO DE PANTALLA COMPLETA */

document.addEventListener(
  'fullscreenchange',
  () => {

    fullscreenBtn.textContent =
      document.fullscreenElement
        ? '⛶ SALIR DE PANTALLA COMPLETA'
        : '⛶ PANTALLA COMPLETA';

  }
);


/* INICIO */

setDuration();

</script>

</body>
</html>
