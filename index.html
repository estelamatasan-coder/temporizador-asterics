<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEMPORIZADOR VISUAL</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#fff;
  color:#102b5c;
  display:flex;
  justify-content:center;
  align-items:flex-start;
}

.app{
  width:min(1180px,96vw);
  height:100vh;
  text-align:center;
  padding:18px 14px 20px;
}

h1{
  margin:0 auto 18px;
  padding:10px 28px;
  font-size:clamp(34px,5.5vw,72px);
  font-weight:900;
  color:#102b5c;
  background:#dff1ff;
  border-radius:28px;
  max-width:1000px;
  text-transform:uppercase;
}

.controls{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:4px;
}

.minutes-label{
  font-size:clamp(20px,2.7vw,30px);
  font-weight:900;
}

input{
  width:105px;
  height:58px;
  border:3px solid #9bb1cf;
  border-radius:14px;
  font-size:29px;
  text-align:center;
  color:#102b5c;
  font-weight:800;
  background:#fff;
}

button{
  min-height:58px;
  padding:10px 22px;
  border:3px solid #9bb1cf;
  border-radius:14px;
  background:#fff;
  color:#102b5c;
  font-size:clamp(18px,2.3vw,28px);
  font-weight:900;
  cursor:pointer;
  box-shadow:0 3px 8px rgba(0,0,0,.08);
}

#start{
  background:#20b36b;
  color:#fff;
  border-color:#159355;
}

#pause{
  background:#248cff;
  color:#fff;
  border-color:#1475df;
}

#reset{
  background:#ffbf27;
  color:#102b5c;
  border-color:#eda600;
}

#fullscreen{
  display:block;
  margin:2px auto 4px;
  background:#6950e8;
  color:#fff;
  border-color:#5540c8;
}

button:hover{
  filter:brightness(.97);
}

.timer{
  position:relative;
  width:min(70vw,680px);
  aspect-ratio:1;
  margin:2px auto 0;
  container-type:inline-size;
}

svg{
  width:100%;
  height:100%;
  transform:rotate(-90deg);
  overflow:visible;
}

.track{
  fill:none;
  stroke:#e1e4e8;
  stroke-width:58;
}

.progress{
  fill:none;
  stroke:url(#progressGradient);
  stroke-width:58;
  stroke-linecap:round;
  transition:stroke-dashoffset .25s linear;
}

.time{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:0 5%;
  font-size:clamp(64px,20cqw,148px);
  font-weight:900;
  color:#102b5c;
  letter-spacing:1px;
  line-height:1;
  z-index:1;
  white-space:nowrap;
}

/* ---------------------------------------
   AVISO: YA QUEDA POCO
   APARECE A LOS 30 SEGUNDOS
   Y QUEDA DEBAJO DEL NÚMERO
---------------------------------------- */

.warning{
  display:none;
  position:absolute;
  left:0;
  right:0;
  top:67%;
  transform:translateY(-50%);
  z-index:4;
  color:#f28c00;
  font-size:clamp(22px,6cqw,48px);
  font-weight:1000;
  line-height:1;
  pointer-events:none;
  white-space:nowrap;
  text-shadow:
    0 2px 0 #fff,
    0 0 8px rgba(242,140,0,.35);
}

.warning.show{
  display:block;
  animation:
    warningFlash .45s ease-in-out infinite alternate,
    warningPulse .9s ease-in-out infinite alternate;
}

@keyframes warningFlash{
  from{
    opacity:.35;
    text-shadow:
      0 2px 0 #fff,
      0 0 5px rgba(242,140,0,.25);
  }

  to{
    opacity:1;
    text-shadow:
      0 2px 0 #fff,
      0 0 20px rgba(242,140,0,.95),
      0 0 35px rgba(242,140,0,.55);
  }
}

@keyframes warningPulse{
  from{
    transform:translateY(-50%) scale(1);
  }

  to{
    transform:translateY(-50%) scale(1.10);
  }
}


/* ---------------------------------------
   PANTALLA FINAL
---------------------------------------- */

.finished{
  display:none;
  position:fixed;
  inset:0;
  z-index:20;
  background:rgba(255,245,245,.98);
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
  padding:25px;
  animation:finishFlash .55s steps(2,end) infinite;
}

.finished.show{
  display:flex;
}

.finished-text{
  font-size:clamp(70px,13vw,180px);
  font-weight:1000;
  color:#e31313;
  text-transform:uppercase;
  margin:0 0 8px;
  line-height:1;
}

.finished-sub{
  font-size:clamp(27px,5vw,58px);
  font-weight:900;
  color:#17243a;
  margin-bottom:18px;
}

.finished-icon{
  font-size:clamp(100px,15vw,190px);
  line-height:1;
  margin-bottom:18px;
}

.finished button{
  background:#ed1c24;
  color:#fff;
  border-color:#c90f16;
  font-size:clamp(21px,3vw,34px);
}

@keyframes finishFlash{
  0%,49%{
    opacity:1;
  }

  50%,100%{
    opacity:.60;
  }
}


/* ---------------------------------------
   MODO ALARMA
---------------------------------------- */

.timer.alarm .progress{
  stroke:#e31313;
  animation:alarmCircle .45s ease-in-out infinite alternate;
}

.timer.alarm .time{
  color:#e31313;
  animation:alarmTime .45s ease-in-out infinite alternate;
}

@keyframes alarmCircle{
  from{
    opacity:.55;
  }

  to{
    opacity:1;
  }
}

@keyframes alarmTime{
  from{
    transform:scale(1);
  }

  to{
    transform:scale(1.06);
  }
}


@media(max-width:650px){

  .app{
    padding-top:10px;
  }

  h1{
    border-radius:20px;
    padding:8px 12px;
    margin-bottom:10px;
  }

  .timer{
    width:88vw;
  }

  .controls{
    gap:6px;
  }

  button{
    padding:8px 12px;
  }

  .warning{
    top:68%;
  }
}

</style>
</head>


<body>

<div class="app">

  <h1>
    TEMPORIZADOR VISUAL
  </h1>


  <div class="controls">

    <span class="minutes-label">
      Minutos:
    </span>

    <input
      id="minutes"
      type="number"
      min="1"
      max="180"
      value="5"
    >

    <button id="start">
      ▶ INICIAR
    </button>

    <button id="pause">
      Ⅱ PAUSA
    </button>

    <button id="reset">
      ↻ REINICIAR
    </button>

  </div>


  <button id="fullscreen">
    ⛶ PANTALLA COMPLETA
  </button>


  <div class="timer" id="timerContainer">

    <svg
      viewBox="0 0 500 500"
      aria-hidden="true"
    >

      <defs>

        <linearGradient
          id="progressGradient"
          x1="0%"
          y1="0%"
          x2="100%"
          y2="100%"
        >

          <stop
            offset="0%"
            stop-color="#087cff"
          ></stop>

          <stop
            offset="100%"
            stop-color="#ef1c2e"
          ></stop>

        </linearGradient>

      </defs>


      <circle
        class="track"
        cx="250"
        cy="250"
        r="200"
      ></circle>


      <circle
        id="progress"
        class="progress"
        cx="250"
        cy="250"
        r="200"
      ></circle>

    </svg>


    <div
      id="time"
      class="time"
    >
      05:00
    </div>


    <div
      id="warning"
      class="warning"
    >
      ¡YA QUEDA POCO!
    </div>

  </div>

</div>


<!-- ---------------------------------------
     PANTALLA FINAL
---------------------------------------- -->

<div
  id="finished"
  class="finished"
  role="alert"
  aria-live="assertive"
>

  <div class="finished-text">
    ¡SE ACABÓ!
  </div>

  <div class="finished-sub">
    TIEMPO TERMINADO
  </div>

  <div class="finished-icon">
    🙅‍♂️
  </div>

  <button id="again">
    ↻ VOLVER A EMPEZAR
  </button>

</div>


<script>

/* ---------------------------------------
   ELEMENTOS
---------------------------------------- */

const minutesInput =
  document.getElementById('minutes');

const timeEl =
  document.getElementById('time');

const progress =
  document.getElementById('progress');

const finished =
  document.getElementById('finished');

const warning =
  document.getElementById('warning');

const startBtn =
  document.getElementById('start');

const pauseBtn =
  document.getElementById('pause');

const resetBtn =
  document.getElementById('reset');

const againBtn =
  document.getElementById('again');

const fullscreenBtn =
  document.getElementById('fullscreen');

const timerContainer =
  document.getElementById('timerContainer');


/* ---------------------------------------
   CÍRCULO
---------------------------------------- */

const radius = 200;

const circumference =
  2 * Math.PI * radius;

progress.style.strokeDasharray =
  circumference;


/* ---------------------------------------
   VARIABLES
---------------------------------------- */

let totalSeconds = 300;

let remaining = 300;

let timer = null;

let running = false;

let returnTimer = null;

let audioCtx = null;


/*
   MUY IMPORTANTE:

   El aviso aparece cuando quedan
   30 segundos o menos.
*/

const WARNING_SECONDS = 30;


/*
   El aviso final dura 20 segundos.
*/

const FINISH_DURATION = 20000;


/* ---------------------------------------
   FORMATO DEL TIEMPO
---------------------------------------- */

function formatTime(seconds){

  const mins =
    Math.floor(seconds / 60);

  const secs =
    seconds % 60;

  return (
    String(mins).padStart(2,'0')
    +
    ':'
    +
    String(secs).padStart(2,'0')
  );

}


/* ---------------------------------------
   ACTUALIZAR PANTALLA
---------------------------------------- */

function updateDisplay(){

  timeEl.textContent =
    formatTime(remaining);


  const ratio =
    totalSeconds
      ? remaining / totalSeconds
      : 0;


  progress.style.strokeDashoffset =
    circumference * (1 - ratio);


  /*
     YA QUEDA POCO:
     aparece a 30 segundos.
  */

  warning.classList.toggle(
    'show',
    remaining > 0 &&
    remaining <= WARNING_SECONDS &&
    running
  );

}


/* ---------------------------------------
   ESTABLECER DURACIÓN
---------------------------------------- */

function setDuration(){

  let m =
    parseInt(
      minutesInput.value,
      10
    );


  if(
    !Number.isFinite(m) ||
    m < 1
  ){

    m = 1;

  }


  if(m > 180){

    m = 180;

  }


  minutesInput.value = m;


  totalSeconds =
    m * 60;


  remaining =
    totalSeconds;


  updateDisplay();

}


/* ---------------------------------------
   PREPARAR AUDIO
---------------------------------------- */

async function prepareAudio(){

  try{

    if(!audioCtx){

      audioCtx =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }


    if(
      audioCtx.state ===
      'suspended'
    ){

      await audioCtx.resume();

    }

  }catch(e){

    console.log(
      'Audio no disponible',
      e
    );

  }

}


/* ---------------------------------------
   CREAR UN PITIDO
---------------------------------------- */

function createBeep(
  startTime,
  frequency
){

  if(!audioCtx){
    return;
  }


  const oscillator =
    audioCtx.createOscillator();

  const gain =
    audioCtx.createGain();


  oscillator.type =
    'sine';


  oscillator.frequency.setValueAtTime(
    frequency,
    startTime
  );


  gain.gain.setValueAtTime(
    0.0001,
    startTime
  );


  gain.gain.exponentialRampToValueAtTime(
    0.32,
    startTime + 0.04
  );


  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    startTime + 0.42
  );


  oscillator
    .connect(gain)
    .connect(audioCtx.destination);


  oscillator.start(
    startTime
  );


  oscillator.stop(
    startTime + 0.46
  );

}


/* ---------------------------------------
   AVISO SONORO DE 20 SEGUNDOS
---------------------------------------- */

function playFinishSound(){

  if(!audioCtx){
    return;
  }


  try{

    const now =
      audioCtx.currentTime;


    /*
       Pitidos durante 20 segundos.
    */

    for(
      let d = 0,
      i = 0;

      d < 20;

      d += 0.8,
      i++
    ){

      createBeep(
        now + d,
        i % 2
          ? 880
          : 660
      );

    }

  }catch(e){

    console.log(
      'Error de sonido',
      e
    );

  }

}


/* ---------------------------------------
   INTENTAR PANTALLA COMPLETA
---------------------------------------- */

async function tryFullscreen(){

  try{

    if(
      document.fullscreenElement
    ){

      return;

    }


    if(
      document.documentElement.requestFullscreen
    ){

      await document
        .documentElement
        .requestFullscreen();

      fullscreenBtn.textContent =
        '⛶ SALIR DE PANTALLA COMPLETA';

    }

  }catch(e){

    /*
       Algunos navegadores no permiten
       pantalla completa automática al
       abrir una página nueva.

       En ese caso no hacemos nada:
       queda disponible el botón.
    */

    console.log(
      'El navegador no permitió pantalla completa automática.',
      e
    );

  }

}


/* ---------------------------------------
   VOLVER AL COMUNICADOR
---------------------------------------- */

function returnToCommunicator(){

  /*
     Primero usamos la página que abrió
     el temporizador.

     document.referrer conserva la
     dirección del comunicador cuando
     esta página se ha abierto desde él.
  */

  const referrer =
    document.referrer;


  if(
    referrer &&
    referrer !== window.location.href
  ){

    window.location.replace(
      referrer
    );

    return;

  }


  /*
     Si no tenemos referrer,
     intentamos volver mediante
     el historial.
  */

  if(
    window.history.length > 1
  ){

    window.history.back();

    return;

  }

}


/* ---------------------------------------
   CANCELAR FINAL
---------------------------------------- */

function cancelFinish(){

  if(returnTimer){

    clearTimeout(
      returnTimer
    );

    returnTimer = null;

  }


  if(audioCtx){

    try{

      audioCtx.close();

    }catch(e){}

    audioCtx = null;

  }


  finished.classList.remove(
    'show'
  );


  timerContainer.classList.remove(
    'alarm'
  );

}


/* ---------------------------------------
   FINAL DEL TEMPORIZADOR
---------------------------------------- */

function finish(){

  clearInterval(timer);

  timer = null;

  running = false;

  remaining = 0;


  updateDisplay();


  /*
     Activamos el modo alarma.
  */

  timerContainer.classList.add(
    'alarm'
  );


  /*
     Mostramos la pantalla final.
  */

  finished.classList.add(
    'show'
  );


  /*
     Empieza el sonido.
  */

  playFinishSound();


  /*
     MUY IMPORTANTE:

     NO volvemos inmediatamente.

     Esperamos 20 segundos completos.
  */

  returnTimer =
    setTimeout(

      function(){

        returnTimer = null;

        /*
           Después de los 20 segundos:
           volvemos al comunicador.
        */

        returnToCommunicator();

      },

      FINISH_DURATION

    );

}


/* ---------------------------------------
   INICIAR
---------------------------------------- */

startBtn.onclick =
  async function(){

    if(running){

      return;

    }


    /*
       Si estaba en cero,
       comenzamos otra vez.
    */

    if(remaining <= 0){

      setDuration();

    }


    /*
       Activamos el audio por la acción
       del usuario.
    */

    await prepareAudio();


    running = true;


    updateDisplay();


    timer =
      setInterval(

        function(){

          remaining--;

          updateDisplay();


          if(
            remaining <= 0
          ){

            finish();

          }

        },

        1000

      );

  };


/* ---------------------------------------
   PAUSA
---------------------------------------- */

pauseBtn.onclick =
  function(){

    if(!running){

      return;

    }


    clearInterval(timer);

    timer = null;

    running = false;

    warning.classList.remove(
      'show'
    );

  };


/* ---------------------------------------
   REINICIAR
---------------------------------------- */

resetBtn.onclick =
  function(){

    clearInterval(timer);

    timer = null;

    running = false;


    if(returnTimer){

      clearTimeout(
        returnTimer
      );

      returnTimer = null;

    }


    if(audioCtx){

      try{

        audioCtx.close();

      }catch(e){}

      audioCtx = null;

    }


    finished.classList.remove(
      'show'
    );


    timerContainer.classList.remove(
      'alarm'
    );


    warning.classList.remove(
      'show'
    );


    setDuration();

  };


/* ---------------------------------------
   VOLVER A EMPEZAR
---------------------------------------- */

againBtn.onclick =
  async function(){

    if(returnTimer){

      clearTimeout(
        returnTimer
      );

      returnTimer = null;

    }


    if(audioCtx){

      try{

        audioCtx.close();

      }catch(e){}

      audioCtx = null;

    }


    finished.classList.remove(
      'show'
    );


    timerContainer.classList.remove(
      'alarm'
    );


    setDuration();


    await prepareAudio();


    running = true;


    updateDisplay();


    timer =
      setInterval(

        function(){

          remaining--;

          updateDisplay();


          if(
            remaining <= 0
          ){

            finish();

          }

        },

        1000

      );

  };


/* ---------------------------------------
   CAMBIO DE MINUTOS
---------------------------------------- */

minutesInput.onchange =
  function(){

    if(!running){

      setDuration();

    }

  };


/* ---------------------------------------
   PANTALLA COMPLETA
---------------------------------------- */

fullscreenBtn.onclick =
  async function(){

    try{

      if(
        !document.fullscreenElement
      ){

        await document
          .documentElement
          .requestFullscreen();

      }else{

        await document
          .exitFullscreen();

      }

    }catch(e){

      console.log(
        'Pantalla completa no disponible',
        e
      );

    }

  };


/* ---------------------------------------
   CAMBIO DE TEXTO DE PANTALLA COMPLETA
---------------------------------------- */

document.addEventListener(
  'fullscreenchange',
  function(){

    fullscreenBtn.textContent =
      document.fullscreenElement
        ? '⛶ SALIR DE PANTALLA COMPLETA'
        : '⛶ PANTALLA COMPLETA';

  }
);


/* ---------------------------------------
   INICIO
---------------------------------------- */

setDuration();


/*
   Intentamos entrar automáticamente
   en pantalla completa al cargar.

   Si el navegador lo permite, se hará.
   Si lo bloquea, no rompe el temporizador.
*/

setTimeout(
  function(){

    tryFullscreen();

  },
  300
);

</script>

</body>
</html>
